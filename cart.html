<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mochi Donuts - Cart</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
</head>

<body>
    <!-- Top Navbar (Desktop) -->
    <header class="navbar">
        <div class="logo">
            <img src="images/logo.png" alt="mochi donuts logo">
        </div>

        <nav class="top-nav">
            <a href="index.html" class="nav-link">
                <span class="nav-icon">
                    <span class="material-symbols-rounded">home</span>
                </span>
            </a>
            <a href="browse.html" class="nav-link">
                <span class="nav-icon">
                    <span class="material-symbols-rounded">menu</span>
                </span>
            </a>
            <a href="cart.html" class="nav-link active">
                <span class="nav-icon">
                    <span class="material-symbols-rounded">shopping_bag</span>
                </span>
                <span class="nav-label">Cart</span>
            </a>
        </nav>
    </header>

    <!-- Page Content -->
    <main class="cart-page">

        <!-- Cart items -->
        <section class="cart-items">
            <!-- Card one -->
            <article class="cart-card">
                <!-- Image + Title -->
                <figure>
                    <img src="images/biscoff.png" alt="Biscoff donut">
                </figure>
                <div class="cart-card-info">
                    <h3>Biscoff with Caramel Drizzle</h3>
                    <p>$4.50</p>
                </div>
                <!-- Quantity -->
                <div class="cart-quantity">
                    <button class="btn-qty">
                        <span class="material-symbols-rounded">remove</span>
                    </button>
                    <span class="qty-count">1</span>
                    <button class="btn-qty">
                        <span class="material-symbols-rounded">add</span>
                    </button>
                </div>
            </article>

            <!-- Card one -->
            <article class="cart-card">
                <!-- Image + Title -->
                <figure>
                    <img src="images/biscoff.png" alt="Biscoff donut">
                </figure>
                <div class="cart-card-info">
                    <h3>Biscoff with Caramel Drizzle</h3>
                    <p>$4.50</p>
                </div>
                <!-- Quantity -->
                <div class="cart-quantity">
                    <button class="btn-qty">
                        <span class="material-symbols-rounded">remove</span>
                    </button>
                    <span class="qty-count">1</span>
                    <button class="btn-qty">
                        <span class="material-symbols-rounded">add</span>
                    </button>
                </div>
            </article>

            <!-- Card one -->
            <article class="cart-card">
                <!-- Image + Title -->
                <figure>
                    <img src="images/biscoff.png" alt="Biscoff donut">
                </figure>
                <div class="cart-card-info">
                    <h3>Biscoff with Caramel Drizzle</h3>
                    <p>$4.50</p>
                </div>
                <div class="cart-quantity">
                    <button class="btn-qty">
                        <span class="material-symbols-rounded">remove</span>
                    </button>
                    <span class="qty-count">1</span>
                    <button class="btn-qty">
                        <span class="material-symbols-rounded">add</span>
                    </button>
                </div>
            </article>
        </section>

        <!-- Order summary -->
        <aside class="order-summary">
            <p class="summary-row"><span>Subtotal</span><span>$9.00</span></p>
            <p class="summary-row"><span>Estimated Taxes</span><span>$1.50</span></p>
            <p class="summary-total"><span>Total</span><span>$10.50</span></p>
            <!-- Proceed to payment button -->
            <button class="btn-add-cart">Proceed to Payment</button>
        </aside>

        <!-- Delivery details + Confirmation -->
    </main>

    <!-- Bottom Navbar (Mobile) -->
    <nav class="bottom-nav"></nav>

    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
