<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mochi Donuts - Cart</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
</head>

<body>
    <!-- Top Navbar (Desktop) -->
    <header class="navbar">
        <div class="logo">
            <img src="images/logo.png" alt="mochi donuts logo">
        </div>

        <nav class="top-nav">
            <a href="index.html" class="nav-link">
                <span class="nav-icon">
                    <span class="material-symbols-rounded">home</span>
                </span>
            </a>
            <a href="browse.html" class="nav-link">
                <span class="nav-icon">
                    <span class="material-symbols-rounded">storefront</span>
                </span>
            </a>
            <a href="cart.html" class="nav-link active">
                <span class="nav-icon">
                    <span class="material-symbols-rounded">shopping_bag</span>
                </span>
                <span class="nav-label">Cart</span>
            </a>
        </nav>
    </header>

    <!-- Page Content -->
    <main class="cart-page">

        <!-- Cart items -->
        <section class="cart-items">
        </section>

        <!-- Order summary -->
        <aside class="order-summary">
            <p class="summary-row"><span>Subtotal</span><span>$9.00</span></p>
            <p class="summary-row"><span>Estimated Taxes</span><span>$1.50</span></p>
            <p class="summary-total"><span>Total</span><span>$10.50</span></p>
            <!-- Proceed to payment button -->
            <button class="btn-add-cart">Proceed to Payment</button>
        </aside>

        <!-- Delivery details + Confirmation -->
    </main>

    <!-- Bottom Navbar (Mobile) -->
    <nav class="bottom-nav"></nav>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-top">
            <div class="footer-brand">
                <img src="images/logo.png" alt="Mochi Donuts">
                <p>Made with love, one donut at a time.</p>
            </div>

            <div class="footer-col">
                <h4>Company</h4>
                <a href="#">About Us</a>
                <a href="#">Careers</a>
                <a href="#">Contact Us</a>
            </div>

            <div class="footer-col">
                <h4>Menu</h4>
                <a href="browse.html">Browse</a>
                <a href="#">Allergens</a>
                <a href="#">Gift Cards</a>
            </div>

            <div class="footer-col">
                <h4>Find Us</h4>
                <a href="#">Locations</a>
                <a href="#">Wholesale</a>
                <a href="#">Loyalty Program</a>
            </div>
        </div>

        <div class="footer-bottom">
            <p>&copy; 2025 Mochi Donuts. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
